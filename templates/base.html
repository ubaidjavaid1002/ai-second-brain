<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>

    <title>AI Second Brain</title>
</head>

<body class="bg-slate-900 text-white min-h-screen">

    <nav class="bg-slate-800 px-6 py-4 flex justify-between">
        <h1 class="text-xl font-bold">AI Second Brain</h1>

        <div>
            {% if request.user.is_authenticated %}
            <a href="/" class="mr-4">Dashboard</a>
            <a href="/users/logout/">Logout</a>
            {% else %}
            <a href="/users/login/" class="mr-4">Login</a>
            <a href="/users/signup/">Signup</a>
            {% endif %}
        </div>
    </nav>

    <div class="p-8">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
